name: Publish

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - name: Check the tag matches the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo pkgid | sed 's/.*@//')
          if [[ "$TAG" != "$version" ]]; then
            echo "tag $TAG does not match crate version $version" >&2
            exit 1
          fi
      - run: cargo test --locked
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
